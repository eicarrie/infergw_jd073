[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eicarrie-infergw_jd073"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告推理网关架构师·奖励模型的过拟合相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eicarrie" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://eicarrie.github.io"
Repository = "https://github.com/eicarrie/infergw_jd073"
Issues = "https://github.com/eicarrie/infergw_jd073/issues"

[project.scripts]
infergw_jd073 = "infergw_jd073:main"

[tool.setuptools]
py-modules = ["infergw_jd073"]
